<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>元氣地牢 2D 多人職業隨機地圖版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; background: #0b1307; }
    .glass-panel { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .color-picker-dot { transition: all 0.2s ease; cursor: pointer; }
    .color-picker-dot.active { transform: scale(1.25); box-shadow: 0 0 12px currentColor; }
    .class-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
    .class-card.active { transform: scale(1.03); border-color: var(--card-color); box-shadow: 0 0 16px var(--card-color); }
    .chat-bubble { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.5) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes bloodPulse { 0% { box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.4); } 50% { box-shadow: inset 0 0 80px rgba(239, 68, 68, 0.85); } 100% { box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.4); } }
    .blood-moon-vignette { animation: bloodPulse 1.5s infinite ease-in-out; pointer-events: none; }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center text-slate-100">

  <div id="gameContainer" class="relative w-full h-full overflow-hidden flex items-center justify-center">
    <canvas id="gameCanvas" class="w-full h-full"></canvas>

    <div id="bloodVignette" class="hidden absolute inset-0 z-10 blood-moon-vignette border-8 border-red-600/40"></div>

    <!-- 地圖橫幅提示 -->
    <div id="mapBanner" class="hidden absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none transition-opacity duration-500 opacity-0">
      <div class="glass-panel px-8 py-4 rounded-3xl border border-cyan-500/50 shadow-2xl text-center">
        <div id="mapBannerTitle" class="text-3xl font-black tracking-widest text-cyan-300">🗺️ 黑森林</div>
      </div>
    </div>

    <!-- 天氣橫幅提示 -->
    <div id="weatherBanner" class="hidden absolute top-1/4 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none transition-opacity duration-500 opacity-0">
      <div id="weatherBannerBox" class="glass-panel px-6 py-3 rounded-2xl border border-amber-500/50 shadow-2xl text-center">
        <div id="weatherBannerTitle" class="text-2xl font-black tracking-widest text-amber-400">天氣變化</div>
      </div>
    </div>

    <!-- 武器解鎖中央提示橫幅 -->
    <div id="weaponUnlockBanner" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-none transition-opacity duration-300 opacity-0">
      <div class="glass-panel px-8 py-4 rounded-3xl border-2 border-amber-400/80 shadow-2xl text-center">
        <div id="weaponUnlockTitle" class="text-2xl font-black tracking-wider text-amber-300">專屬武器解鎖</div>
      </div>
    </div>

    <!-- TOP HUD OVERLAY -->
    <div id="hud" class="hidden absolute top-3 left-3 right-3 flex justify-between items-start pointer-events-none z-20">
      <div class="flex flex-col gap-2 w-60 sm:w-72 glass-panel p-3 rounded-2xl shadow-2xl pointer-events-auto">
        <div class="flex items-center justify-between text-xs font-bold text-slate-300">
          <span id="playerRoleTag" class="text-amber-400 flex items-center gap-1">
            <span id="playerColorIndicator" class="w-3 h-3 rounded-full bg-cyan-400 inline-block shadow"></span>
            <span id="playerNameDisplay" style="cursor:pointer" onclick="const n = prompt('輸入新名稱：'); if(n) renamePlayer(n);">🎖️ 勇者</span>
            <span id="minionCountTag" class="text-purple-300 font-extrabold ml-1 hidden">💀 x 0</span>
          </span>
          <span id="levelText" class="text-cyan-400 font-extrabold">Lv. 1</span>
        </div>
        <div class="w-full bg-slate-800 h-3.5 rounded-full overflow-hidden border border-slate-700 relative">
          <div id="hpBar" class="bg-gradient-to-r from-red-600 to-emerald-500 h-full w-full transition-all duration-200"></div>
          <span id="hpText" class="absolute inset-0 text-[10px] flex items-center justify-center font-black tracking-wider text-white drop-shadow">100 / 100</span>
        </div>
        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700 relative">
          <div id="shieldBar" class="bg-gradient-to-r from-cyan-600 to-blue-400 h-full w-full transition-all duration-200"></div>
          <span id="shieldText" class="absolute inset-0 text-[9px] flex items-center justify-center font-bold text-cyan-100 drop-shadow">50 / 50</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700 relative">
          <div id="expBar" class="bg-amber-400 h-full w-0 transition-all duration-150"></div>
        </div>
      </div>

      <div class="flex flex-col items-end gap-2 pointer-events-auto">
        <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 shadow-2xl">
          <div class="flex flex-col items-end">
            <span id="timeNameText" class="text-xs text-amber-300 font-bold">🌞 白天</span>
            <span id="weatherNameText" class="text-[10px] text-slate-300">☀️ 晴天</span>
            <span id="hudMapNameText" class="text-[10px] text-cyan-400 font-bold">🗺️ 黑森林</span>
          </div>
          <div class="w-px h-8 bg-slate-700"></div>
          <div class="flex flex-col items-center">
            <span class="text-[9px] text-slate-400">波次</span>
            <span id="waveText" class="text-xl font-black text-amber-400">WAVE 1</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CHAT OVERLAY BOX -->
    <div id="chatContainer" class="hidden absolute left-3 top-24 w-64 sm:w-80 glass-panel rounded-2xl p-2.5 flex flex-col gap-2 z-20 shadow-2xl border border-slate-700/80 pointer-events-auto">
      <div id="chatHeader" class="flex justify-between items-center text-xs font-bold text-slate-400 border-b border-slate-800 pb-1 cursor-move select-none">
        <span><i class="fa-solid fa-arrows-up-down-left-right text-slate-500 mr-1"></i><i class="fa-solid fa-comments mr-1 text-cyan-400"></i> 小隊通訊頻道</span>
        <button id="toggleChatBtn" class="text-slate-500 hover:text-slate-200"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
      <div id="chatMessages" class="h-28 overflow-y-auto text-xs flex flex-col gap-1.5 custom-scrollbar pr-1">
        <div class="text-slate-500 italic text-[11px]">選擇合適的職業，與隊友並肩作戰！按 [M] 可重抽地圖。</div>
      </div>
      <div class="flex gap-1 overflow-x-auto custom-scrollbar pb-1">
        <button onclick="sendPresetChat('🆘 需要救援！')" class="bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-300 text-[10px] px-2 py-0.5 rounded-lg whitespace-nowrap">🆘 救援</button>
        <button onclick="sendPresetChat('⚔️ 衝波次！')" class="bg-amber-950/80 hover:bg-amber-900 border border-amber-800 text-amber-300 text-[10px] px-2 py-0.5 rounded-lg whitespace-nowrap">⚔️ 進攻</button>
        <button onclick="sendPresetChat('👍 幹得好！')" class="bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-800 text-emerald-300 text-[10px] px-2 py-0.5 rounded-lg whitespace-nowrap">👍 讚</button>
      </div>
      <form id="chatForm" class="flex gap-1.5">
        <input type="text" id="chatInput" maxlength="30" placeholder="輸入訊息..." class="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-cyan-400" />
        <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-3 py-1 rounded-xl text-xs transition-colors flex items-center justify-center">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

    <!-- BOTTOM CONTROLS & JOYSTICKS -->
    <div id="bottomControls" class="hidden absolute bottom-10 sm:bottom-14 left-4 right-
